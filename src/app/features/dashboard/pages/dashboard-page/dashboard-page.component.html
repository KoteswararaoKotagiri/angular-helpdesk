<section class="dashboard-page">
  <div class="dashboard-page__toolbar">
    <button mat-stroked-button type="button" (click)="refresh()" [disabled]="isLoading">
      <mat-spinner *ngIf="isLoading; else refreshIcon" [diameter]="16"></mat-spinner>
      <ng-template #refreshIcon><mat-icon>refresh</mat-icon></ng-template>
      {{ isLoading ? 'Refreshing…' : 'Refresh' }}
    </button>
  </div>

  <app-dashboard-header
    title="Good morning, Koteswar"
    [subtitle]="'Here is what is happening with your helpdesk today - ' + todayLabel"
    [filters]="filters"
  />

  <!-- Error state -->
  <div class="dashboard-error" *ngIf="error && !isLoading">
    <mat-icon>error_outline</mat-icon>
    <div class="dashboard-error__body">
      <strong>Something went wrong</strong>
      <span>{{ error }}</span>
    </div>
    <button mat-flat-button color="primary" type="button" (click)="refresh()">Try again</button>
  </div>

  <!-- Loading skeletons (first load only) -->
  <ng-container *ngIf="isLoading && !hasData">
    <div class="stats-grid">
      <app-dashboard-loading-state *ngFor="let row of [1, 2, 3, 4, 5]" [rows]="1" />
    </div>
    <div class="dashboard-grid dashboard-grid--main">
      <app-dashboard-loading-state class="span-2" [rows]="5" />
      <app-dashboard-loading-state [rows]="5" />
      <app-dashboard-loading-state [rows]="4" />
    </div>
    <div class="dashboard-grid dashboard-grid--operations">
      <app-dashboard-loading-state [rows]="5" />
      <app-dashboard-loading-state [rows]="5" />
    </div>
  </ng-container>

  <!-- Live content -->
  <ng-container *ngIf="!error && (hasData || !isLoading)">
    <div class="stats-grid" aria-label="Dashboard statistics" *ngIf="stats.length; else statsEmpty">
      <app-stat-card *ngFor="let stat of stats" [stat]="stat" />
    </div>
    <ng-template #statsEmpty>
      <app-dashboard-empty-state icon="analytics" title="No statistics yet" message="Ticket statistics will appear here once tickets are created." />
    </ng-template>

    <div class="dashboard-grid dashboard-grid--main" *ngIf="charts.length">
      <app-chart-widget class="span-2" [widget]="charts[0]" />
      <app-chart-widget [widget]="charts[1]" />
      <app-quick-actions [actions]="quickActions" />
    </div>

    <div class="dashboard-grid dashboard-grid--operations">
      <app-dashboard-card title="Ticket summary" eyebrow="Current queue" actionLabel="View all" actionIcon="arrow_forward" [flush]="true">
        <div class="ticket-table" role="table" aria-label="Recent tickets" *ngIf="tickets.length; else ticketsEmpty">
          <div class="ticket-table__head" role="row">
            <span>Ticket</span>
            <span>Priority</span>
            <span>Status</span>
            <span>Owner</span>
            <span>SLA</span>
          </div>
          <div class="ticket-table__row" role="row" *ngFor="let ticket of tickets">
            <span>
              <strong>{{ ticket.id }}</strong>
              {{ ticket.title }}
            </span>
            <em [ngClass]="'tone-' + ticket.priorityTone">{{ ticket.priority }}</em>
            <em [ngClass]="'tone-' + ticket.statusTone">{{ ticket.status }}</em>
            <span>{{ ticket.assignee }}</span>
            <b [ngClass]="'tone-text-' + ticket.slaTone">{{ ticket.sla }}</b>
          </div>
        </div>
        <ng-template #ticketsEmpty>
          <app-dashboard-empty-state icon="inbox" title="No recent tickets" message="Newly created tickets will show up here." />
        </ng-template>
      </app-dashboard-card>

      <app-activity-feed *ngIf="activities.length; else activityEmpty" [activities]="activities" />
      <ng-template #activityEmpty>
        <app-dashboard-card title="Activity" eyebrow="Latest">
          <app-dashboard-empty-state icon="history" title="No recent activity" message="Ticket updates and comments will appear here." />
        </app-dashboard-card>
      </ng-template>
    </div>

    <div class="dashboard-grid dashboard-grid--supporting">
      <app-chart-widget *ngIf="charts.length" [widget]="charts[2]" />

      <app-sla-widget *ngIf="slaItems.length; else slaEmpty" [items]="slaItems" />
      <ng-template #slaEmpty>
        <app-dashboard-card title="SLA performance" eyebrow="Compliance">
          <app-dashboard-empty-state icon="shield" title="No SLA data" message="SLA metrics appear once tickets are being tracked." />
        </app-dashboard-card>
      </ng-template>

      <app-notification-widget *ngIf="notifications.length; else notificationsEmpty" [notifications]="notifications" />
      <ng-template #notificationsEmpty>
        <app-dashboard-card title="SLA alerts" eyebrow="Live">
          <app-dashboard-empty-state icon="notifications_none" title="No SLA alerts" message="Overdue and at-risk tickets will be flagged here." />
        </app-dashboard-card>
      </ng-template>
    </div>
  </ng-container>
</section>
