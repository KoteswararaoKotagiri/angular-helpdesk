<section class="composer" [class.composer--note]="mode === 'note'" aria-label="Conversation composer">
  <header class="composer__header">
    <mat-button-toggle-group [(ngModel)]="mode" aria-label="Message visibility">
      <mat-button-toggle value="reply"><mat-icon>public</mat-icon>Public reply</mat-button-toggle>
      <mat-button-toggle value="note"><mat-icon>lock</mat-icon>Internal note</mat-button-toggle>
    </mat-button-toggle-group>
    <span class="composer__visibility">
      <mat-icon>{{ mode === 'note' ? 'visibility_off' : 'visibility' }}</mat-icon>
      {{ mode === 'note' ? 'Agents only' : 'Visible to requester' }}
    </span>
  </header>

  <div class="composer__surface">
    <span class="composer__avatar">RK</span>
    <div class="composer__editor">
      <textarea [(ngModel)]="draft" rows="4" placeholder="Write a focused update, attach evidence, or @mention a teammate..."></textarea>
      <div class="composer__mentions">
        <mat-chip-set aria-label="Suggested mentions">
          <mat-chip *ngFor="let mention of suggestedMentions">{{ mention }}</mat-chip>
          <mat-chip>+ tag queue</mat-chip>
        </mat-chip-set>
      </div>
    </div>
  </div>

  <div class="composer__drop">
    <app-upload-zone />
  </div>

  <footer class="composer__bar">
    <div class="composer__tools">
      <button mat-icon-button type="button" matTooltip="Attach file"><mat-icon>attach_file</mat-icon></button>
      <button mat-icon-button type="button" matTooltip="Mention teammate"><mat-icon>alternate_email</mat-icon></button>
      <button mat-icon-button type="button" matTooltip="Emoji reaction"><mat-icon>add_reaction</mat-icon></button>
      <button mat-icon-button type="button" matTooltip="Insert saved reply" [matMenuTriggerFor]="templateMenu"><mat-icon>article</mat-icon></button>
    </div>
    <div class="composer__send">
      <span>Ctrl + Enter</span>
      <button mat-flat-button color="primary" type="button">
        <mat-icon>send</mat-icon>
        {{ mode === 'note' ? 'Add note' : 'Send reply' }}
      </button>
    </div>
  </footer>
</section>

<mat-menu #templateMenu="matMenu">
  <button mat-menu-item type="button"><mat-icon>schedule</mat-icon><span>15 minute incident update</span></button>
  <button mat-menu-item type="button"><mat-icon>engineering</mat-icon><span>Escalation request</span></button>
  <button mat-menu-item type="button"><mat-icon>task_alt</mat-icon><span>Resolution confirmation</span></button>
</mat-menu>
