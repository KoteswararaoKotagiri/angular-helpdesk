<section class="timeline">
  <header>
    <span>Audit trail</span>
    <h2>Activity timeline</h2>
  </header>
  <ol>
    <li *ngFor="let item of items" [ngClass]="'tone-' + item.tone">
      <span class="timeline__icon"><mat-icon>{{ item.icon }}</mat-icon></span>
      <div>
        <strong>{{ item.title }}</strong>
        <p>{{ item.description }}</p>
        <small>{{ item.timestamp }}</small>
      </div>
    </li>
  </ol>
</section>
