<section class="attachments">
  <header>
    <div>
      <span>Files</span>
      <h2>Attachments</h2>
      <p>{{ attachments.length }} files shared in this ticket</p>
    </div>
    <button mat-icon-button type="button" matTooltip="Upload file"><mat-icon>add</mat-icon></button>
  </header>
  <app-upload-zone (fileSelected)="fileSelected.emit($event)" />
  <div class="attachments__list">
    <app-attachment-card *ngFor="let attachment of attachments" [attachment]="attachment" (downloadRequested)="downloadRequested.emit($event)" />
  </div>
</section>
