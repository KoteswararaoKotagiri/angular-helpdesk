<section class="thread" aria-label="Ticket conversation">
  <app-conversation-toolbar [count]="items.length" [participants]="activeParticipants" />

  <app-message-composer (submitted)="commentSubmitted.emit($event)" />

  <div class="thread__presence">
    <app-typing-indicator names="Priya and Vijay" />
    <span class="thread__unread"><mat-icon>fiber_manual_record</mat-icon>2 unread updates</span>
  </div>

  <div class="thread__items">
    <ng-container *ngFor="let item of items">
      <article *ngIf="item.type === 'activity'; else conversationMessage" class="activity-message">
        <mat-icon>auto_awesome</mat-icon>
        <span>{{ item.body }}</span>
        <small>{{ item.timestamp }}</small>
      </article>
      <ng-template #conversationMessage>
        <app-internal-note-card *ngIf="item.type === 'internal'; else publicComment" [item]="item" />
      </ng-template>
      <ng-template #publicComment>
        <app-comment-card [item]="item" />
      </ng-template>
    </ng-container>
  </div>
</section>
