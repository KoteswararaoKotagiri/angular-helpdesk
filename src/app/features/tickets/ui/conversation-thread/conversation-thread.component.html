<section class="thread" aria-label="Ticket conversation">
  <header class="thread__header">
    <div>
      <span>Conversation</span>
      <h2>Customer and team thread</h2>
    </div>
    <mat-button-toggle-group value="reply" aria-label="Composer mode">
      <mat-button-toggle value="reply">Reply</mat-button-toggle>
      <mat-button-toggle value="note">Note</mat-button-toggle>
    </mat-button-toggle-group>
  </header>

  <div class="composer">
    <div class="composer__top">
      <span class="avatar">RK</span>
      <textarea rows="3" placeholder="Write a clear reply, add an internal note, or @mention a teammate..."></textarea>
    </div>
    <div class="composer__bar">
      <div>
        <button mat-icon-button type="button" matTooltip="Attach file"><mat-icon>attach_file</mat-icon></button>
        <button mat-icon-button type="button" matTooltip="Insert template"><mat-icon>article</mat-icon></button>
        <button mat-icon-button type="button" matTooltip="Mention teammate"><mat-icon>alternate_email</mat-icon></button>
      </div>
      <button mat-flat-button color="primary" type="button"><mat-icon>send</mat-icon>Send reply</button>
    </div>
  </div>

  <div class="thread__live">
    <span></span>
    Priya is reviewing the latest attachment
  </div>

  <div class="thread__items">
    <ng-container *ngFor="let item of items">
      <app-internal-note-card *ngIf="item.type === 'internal'; else publicComment" [item]="item" />
      <ng-template #publicComment>
        <app-comment-card [item]="item" />
      </ng-template>
    </ng-container>
  </div>
</section>
