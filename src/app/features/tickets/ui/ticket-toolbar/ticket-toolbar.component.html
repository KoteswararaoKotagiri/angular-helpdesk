<header class="ticket-toolbar">
  <div class="ticket-toolbar__intro">
    <span>Ticket operations</span>
    <h1>Tickets</h1>
    <p>47 open - 18 resolved today - 3 SLA at risk</p>
  </div>

  <div class="ticket-toolbar__metrics" aria-label="Ticket metrics">
    <div *ngFor="let metric of metrics" [ngClass]="'tone-' + metric.tone">
      <strong>{{ metric.value }}</strong>
      <span>{{ metric.label }}</span>
    </div>
  </div>

  <div class="ticket-toolbar__actions">
    <label class="ticket-search">
      <mat-icon>search</mat-icon>
      <input type="search" placeholder="Search tickets, requesters, tags" />
      <kbd>Ctrl K</kbd>
    </label>
    <button mat-icon-button matTooltip="Refresh list" type="button"><mat-icon>refresh</mat-icon></button>
    <button mat-stroked-button type="button" [matMenuTriggerFor]="exportMenu"><mat-icon>download</mat-icon>Export</button>
    <mat-menu #exportMenu="matMenu">
      <button mat-menu-item type="button"><mat-icon>table_view</mat-icon><span>CSV export</span></button>
      <button mat-menu-item type="button"><mat-icon>description</mat-icon><span>Manager report</span></button>
    </mat-menu>
    <button mat-flat-button color="primary" type="button"><mat-icon>add</mat-icon>New ticket</button>
  </div>
</header>
