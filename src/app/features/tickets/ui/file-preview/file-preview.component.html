<div class="preview" [ngClass]="previewClass">
  <ng-container [ngSwitch]="attachment.previewKind">
    <div *ngSwitchCase="'image'" class="preview__image">
      <span></span><span></span><span></span>
    </div>
    <div *ngSwitchCase="'spreadsheet'" class="preview__sheet">
      <span *ngFor="let cell of [1,2,3,4,5,6,7,8,9]"></span>
    </div>
    <div *ngSwitchCase="'log'" class="preview__log">
      <span *ngFor="let line of [1,2,3,4]"></span>
    </div>
    <div *ngSwitchDefault class="preview__icon">
      <mat-icon>{{ attachment.icon }}</mat-icon>
    </div>
  </ng-container>
  <span class="preview__type">{{ attachment.type }}</span>
</div>
