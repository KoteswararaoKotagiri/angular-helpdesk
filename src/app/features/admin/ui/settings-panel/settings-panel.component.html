<section class="settings-grid" aria-label="System settings">
  <article class="settings-card" *ngFor="let section of sections">
    <div class="settings-card__header">
      <div><mat-icon>{{ section.icon }}</mat-icon></div>
      <span>{{ section.status }}</span>
    </div>
    <h2>{{ section.title }}</h2>
    <p>{{ section.description }}</p>
    <ul>
      <li *ngFor="let item of section.items">{{ item }}</li>
    </ul>
    <button mat-stroked-button type="button">Configure</button>
  </article>
</section>
