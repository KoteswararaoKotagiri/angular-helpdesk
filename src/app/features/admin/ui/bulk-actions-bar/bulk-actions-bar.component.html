<section class="bulk-bar" *ngIf="selectedCount > 0" aria-label="Bulk actions">
  <div>
    <strong>{{ selectedCount }} selected</strong>
    <span>Bulk changes are staged before they are applied.</span>
  </div>
  <nav>
    <button mat-stroked-button type="button"><mat-icon>assignment_ind</mat-icon>Assign role</button>
    <button mat-stroked-button type="button"><mat-icon>business</mat-icon>Move department</button>
    <button mat-stroked-button type="button"><mat-icon>block</mat-icon>Deactivate</button>
  </nav>
</section>
