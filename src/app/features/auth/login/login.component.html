<section class="login-page" aria-labelledby="login-title">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-mark">HD</div>
      <span>HelpDesk Pro</span>
    </div>

    <h1 id="login-title" class="login-title">Welcome back</h1>
    <p class="login-subtitle">Sign in to your enterprise account</p>

    <button class="sso-btn" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#4285f4" d="M47.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.6h13.2c-.6 3-2.3 5.6-4.9 7.3v6h7.9c4.6-4.3 7.3-10.6 7.3-17.4z" />
        <path fill="#34a853" d="M24 48c6.6 0 12.2-2.2 16.2-5.9l-7.9-6c-2.2 1.5-5 2.3-8.3 2.3-6.4 0-11.8-4.3-13.7-10.1H2.1v6.2C6 42.6 14.4 48 24 48z" />
        <path fill="#fbbc05" d="M10.3 28.3c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7v-6.2H2.1C.8 15.7 0 19.7 0 24s.8 8.3 2.1 11.3l8.2-7z" />
        <path fill="#ea4335" d="M24 9.5c3.6 0 6.8 1.2 9.3 3.6l7-7C36.2 2.2 30.6 0 24 0 14.4 0 6 5.4 2.1 13.3l8.2 6.2C12.2 13.8 17.6 9.5 24 9.5z" />
      </svg>
      Continue with Google SSO
    </button>

    <div class="login-divider">
      <div class="login-divider-line"></div>
      <span class="login-divider-text">or sign in with email</span>
      <div class="login-divider-line"></div>
    </div>

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Work email</mat-label>
      <input matInput type="email" value="admin@helpdesk.com" autocomplete="email" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Password</mat-label>
      <input matInput type="password" value="password" autocomplete="current-password" />
    </mat-form-field>

    <div class="login-options">
      <mat-checkbox checked>Remember for 30 days</mat-checkbox>
      <a>Forgot password?</a>
    </div>

    <button class="sign-in-btn" mat-flat-button type="button" (click)="signIn()">
      Sign in
      <mat-icon>arrow_forward</mat-icon>
    </button>

    <p class="security-note">
      Protected by enterprise SSO <span aria-hidden="true">.</span> <a>Contact IT Support</a>
    </p>
  </div>
</section>
